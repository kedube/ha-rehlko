name: Frontend

on:
  push:
    paths:
      - "frontend/**"
      - "custom_components/rehlko_energy/www/**"
      - "custom_components/rehlko_energy/translations/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "custom_components/rehlko_energy/www/**"
      - "custom_components/rehlko_energy/translations/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:
  workflow_call: # release.yml runs these checks before publishing

permissions: {}

jobs:
  panel:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test
      # The built panel is committed (the integration serves it): the script and the product
      # photos in www/assets. Fail if anything there differs from this build, including a
      # photo that was added, renamed or removed.
      - name: Built panel is up to date
        run: |
          changes="$(git status --porcelain -- ../custom_components/rehlko_energy/www)"
          if [ -n "$changes" ]; then
            echo "::error::www/ differs from a fresh build. Run npm run build and commit the result."
            echo "$changes"
            exit 1
          fi
