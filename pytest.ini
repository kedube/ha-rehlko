[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning
    # A task that crashes unseen is a bug, not noise.
    error::pytest.PytestUnraisableExceptionWarning
markers =
    real_app_credentials: use the app credentials written into the integration, not the tests' stand-in
